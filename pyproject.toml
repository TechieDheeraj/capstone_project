[project]
name = "refund-desk"
version = "1.0.0"
description = "Capstone project: a production-style support agent that resolves refund tickets safely."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
browser = ["playwright>=1.45"]

[project.scripts]
refund-desk = "refund_desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["refund_desk*"]

[tool.setuptools.package-data]
refund_desk = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B023"]
